# SiteTrack Construction Manager - Server Configuration
# RMI registry port (must be between 3000 and 6000)
rmi.port=4567

# RMI server hostname (use 127.0.0.1 for local, or set to server IP for network)
rmi.hostname=127.0.0.1

# SMTP Configuration (Gmail)
mail.host=smtp.gmail.com
mail.port=587
mail.username=your_email@gmail.com
mail.password=your_app_password
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# OTP Configuration
otp.expiry.minutes=5
otp.length=6
